server {
    listen 80;
    server_name gym.198-199-82-161.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://gym.198-199-82-161.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gym.198-199-82-161.sslip.io;
    ssl_certificate /etc/letsencrypt/live/gym.198-199-82-161.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.198-199-82-161.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GymSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 32m;

    # Fotos del registro: directo al backend de acceso. El proxy de Next
    # corta a los 30 s y el celular ve HTTP 500 aunque el gesto ya haya pasado.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /kiosk/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # El maniquí se versiona en la URL (?v=). Se puede cachear un año y
    # comprimirlo en el camino: el archivo es binario pero sigue siendo comprimible.
    location /models/motion-studio/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        gzip on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types model/gltf-binary application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VISIONYX</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 100%; overflow: hidden; background: #070b14; color: #eaf1fb; font-family: "Exo 2", "Segoe UI", sans-serif; }
    .frame { width: 1080px; height: 100%; display: flex; flex-direction: column; padding: 72px 48px 64px; }
    .brand { display: flex; align-items: center; gap: 16px; font-family: Orbitron, sans-serif; font-weight: 800; letter-spacing: .08em; font-size: 22px; }
    .brand img { width: 72px; height: 72px; object-fit: contain; }
    .kicker { margin-top: 22px; color: #22d3ee; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 18px; }
    h1 { margin-top: 8px; font-family: Orbitron, sans-serif; font-size: 46px; line-height: 1.08; font-weight: 800; }
    .say { margin-top: 12px; font-size: 28px; line-height: 1.3; color: #d5e2f4; }
    .shot { margin-top: 20px; flex: 1; min-height: 0; display: flex; align-items: flex-start; }
    .shot img { width: 100%; max-height: 100%; object-fit: contain; object-position: left top; border-radius: 18px; }
    .end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .end img { width: 280px; height: 220px; object-fit: contain; }
    .end h1 { margin-top: 28px; max-width: 16em; }
    .end p { margin-top: 16px; font-size: 30px; color: #c5d4ea; }
    .cta { margin-top: 28px; font-family: Orbitron, sans-serif; letter-spacing: .14em; color: #22d3ee; font-size: 22px; }
  </style>
</head>
<body>
  <div class="frame" id="root"></div>
  <script>
    const R = "../recortes/";
    const S = {
      m1: ["Entrada", "El control empieza en la entrada", "Cada puerta queda identificada.", R + "torniquetes.png"],
      m2: ["Enrolamiento", "Enrola a tus socios a distancia", "Recepción crea la ficha y envía el enlace.", R + "acceso.png"],
      m3: ["Acceso", "Reconocimiento facial en el acceso", "La puerta responde cuando el controlador y el reconocimiento están en regla.", R + "torniquetes.png"],
      m4: ["Registro", "Cada intento queda en el historial", "Quién llegó, si el plan cubría y si se ordenó abrir.", "cortes/accesos.png"],
      m5: ["Socios", "Socios y membresías, juntos", "La ficha y el plan viven en el mismo sistema.", R + "clientes.png"],
      m6: ["Caja", "La venta queda registrada", "Sin turno abierto no se cobra.", R + "caja.png"],
      m7: ["Operación", "El día de la sede, a la vista", "Ventas, puerta y quién puede entrar.", R + "dashboard.png"],
      m8: ["Entrenamiento", "La rutina se publica y se asigna", "Editar después no cambia la versión ya asignada.", R + "rutinas.png"],
      m9: ["Entrenamiento", "El maniquí muestra el movimiento", "El recorrido no certifica la técnica.", R + "estudio.png"],
      m10: { end: true, title: "Tu gimnasio, bajo control.", lead: "Enrolamiento a distancia y acceso por reconocimiento facial.", cta: "SOLICITA UNA DEMOSTRACIÓN" },
      a1: ["Acceso", "Moderniza el ingreso", "Reconocimiento facial en el punto de acceso.", R + "torniquetes.png"],
      a2: ["Registro", "El intento queda escrito", "Quién llegó y cuál fue el resultado.", "cortes/accesos.png"],
      a3: { end: true, title: "Tu gimnasio, bajo control.", lead: "Reconocimiento facial para el acceso.", cta: "SOLICITA UNA DEMOSTRACIÓN" },
      b1: ["Enrolamiento", "El alta puede empezar a distancia", "Recepción crea la ficha y envía el enlace.", R + "acceso.png"],
      b2: ["Enrolamiento", "El acceso sigue bloqueado", "Hasta el rostro, el plan y la sede autorizada.", R + "acceso.png"],
      b3: { end: true, title: "Tu gimnasio, bajo control.", lead: "Enrola a tus socios a distancia.", cta: "SOLICITA UNA DEMOSTRACIÓN" },
      c1: ["Socios", "También lo que pasa dentro", "Socios y membresías en el mismo sistema.", R + "clientes.png"],
      c2: ["Operación", "Caja, rutinas y el día de la sede", "La operación diaria, en la misma plataforma.", R + "caja.png"],
      c3: { end: true, title: "Tu gimnasio, bajo control.", lead: "Acceso, socios y operación en un solo lugar.", cta: "SOLICITA UNA DEMOSTRACIÓN" },
      k1: ["01  Acceso facial", "Moderniza el ingreso a tu gimnasio", "Reconocimiento de la persona autorizada en el punto de acceso.", R + "torniquetes.png"],
      k2: ["02  Enrolamiento", "Inicia el alta a distancia", "Recepción crea la ficha y envía el enlace al socio.", R + "acceso.png"],
      k3: ["03  Historial", "Consulta los registros de ingreso", "Cada intento guarda quién llegó y si se ordenó abrir.", "cortes/accesos.png"],
      k4: ["04  Socios", "Organiza la información comercial", "La ficha y la membresía viven en el mismo sistema.", R + "clientes.png"],
      k5: ["05  Caja", "Controla la operación del día", "Sin turno abierto no se cobra.", R + "caja.png"],
      k6: ["06  Entrenamiento", "Rutinas y el movimiento en 3D", "El maniquí reproduce el ejercicio del catálogo.", R + "estudio.png"]
    };
    function paint() {
      const id = (location.hash || "#m1").slice(1);
      const row = S[id];
      const root = document.getElementById("root");
      if (!row) return;
      if (row.end) {
        root.innerHTML = `<div class="end"><img src="logo-fe.png" alt="" /><div class="brand" style="margin-top:18px">VISIONYX</div><h1>${row.title}</h1><p>${row.lead}</p><div class="cta">${row.cta}</div></div>`;
        return;
      }
      root.innerHTML = `<div class="brand"><img src="logo-fe.png" alt="" />VISIONYX</div><div class="kicker">${row[0]}</div><h1>${row[1]}</h1><p class="say">${row[2]}</p><div class="shot"><img src="${row[3]}" alt="" /></div>`;
    }
    window.addEventListener("hashchange", paint);
    paint();
  </script>
</body>
</html>
